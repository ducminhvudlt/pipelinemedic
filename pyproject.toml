[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelinemedic"
version = "0.2.0"
description = "An AI on-call assistant for data pipelines that refuses to guess."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pipelinemedic = "pipelinemedic.cli:main"

[tool.setuptools.packages.find]
include = ["pipelinemedic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
